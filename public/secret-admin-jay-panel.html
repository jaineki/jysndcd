<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaySoundCloud - Secret Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        soundcloud: {
                            orange: '#ff5500',
                            dark: '#121212',
                            card: '#1e1e1e',
                            hover: '#2a2a2a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-soundcloud-dark text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="bg-soundcloud-card border-b border-gray-800 py-4 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-soundcloud-orange flex items-center justify-center text-white font-bold">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-white">Jay's Secret Admin Portal</h1>
                <p class="text-xs text-gray-400">User Subscription Tier Management</p>
            </div>
        </div>
        <div id="admin-user-area" class="hidden">
            <button onclick="adminLogout()" class="bg-gray-800 hover:bg-red-500/20 hover:text-red-400 text-gray-300 px-3 py-2 rounded-xl text-xs font-medium transition border border-gray-700">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout Admin
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
        
        <!-- ADMIN LOGIN SCREEN -->
        <div id="admin-login-card" class="max-w-md mx-auto bg-soundcloud-card border border-gray-800 rounded-3xl p-8 shadow-2xl my-12">
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-soundcloud-orange/10 text-soundcloud-orange flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-lg font-bold text-white">Admin Authentication</h2>
                <p class="text-xs text-gray-400 mt-1">Enter your secret username and password</p>
            </div>

            <div id="login-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-xs mb-4"></div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Admin Username</label>
                    <input type="text" id="admin-user" required autocomplete="username" class="w-full px-4 py-2.5 bg-soundcloud-dark border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-soundcloud-orange">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Admin Password</label>
                    <input type="password" id="admin-pass" required autocomplete="current-password" class="w-full px-4 py-2.5 bg-soundcloud-dark border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-soundcloud-orange">
                </div>
                <button type="submit" class="w-full py-3 bg-soundcloud-orange hover:bg-orange-600 text-white rounded-xl font-medium text-sm transition shadow-lg shadow-soundcloud-orange/20">
                    Access Admin Panel
                </button>
            </form>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="admin-dashboard" class="hidden space-y-8">
            
            <!-- Assign / Update Tier Card -->
            <div class="bg-soundcloud-card border border-gray-800 rounded-2xl p-6 shadow-xl">
                <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-soundcloud-orange"></i> Assign or Update User Tier
                </h3>
                
                <div id="action-success" class="hidden bg-green-500/10 border border-green-500/20 text-green-400 p-3 rounded-xl text-xs mb-4"></div>
                <div id="action-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-xs mb-4"></div>

                <form onsubmit="handleAssignTier(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">User Gmail Address</label>
                        <input type="email" id="target-email" required placeholder="user@gmail.com" class="w-full px-4 py-2.5 bg-soundcloud-dark border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-soundcloud-orange">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1.5">Select Subscription Tier</label>
                        <select id="target-tier" class="w-full px-4 py-2.5 bg-soundcloud-dark border border-gray-700 rounded-xl text-sm focus:outline-none focus:border-soundcloud-orange text-white">
                            <option value="starter">Starter (₱9 / 3 Days)</option>
                            <option value="popular">Popular (₱29 / 7 Days)</option>
                            <option value="premium">Premium (₱49 / 30 Days)</option>
                            <option value="free">Free / Revoke</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full py-2.5 bg-soundcloud-orange hover:bg-orange-600 text-white rounded-xl font-medium text-sm transition shadow-md shadow-soundcloud-orange/20">
                            Save Tier
                        </button>
                    </div>
                </form>
            </div>

            <!-- Subscribed Users List -->
            <div class="bg-soundcloud-card border border-gray-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-users text-soundcloud-orange"></i> Managed Subscriptions
                    </h3>
                    <button onclick="loadSubscriptions()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 border border-gray-700">
                        <i class="fa-solid fa-rotate"></i> Refresh List
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-gray-800 text-gray-400 uppercase tracking-wider">
                                <th class="py-3 px-4">Email</th>
                                <th class="py-3 px-4">Tier</th>
                                <th class="py-3 px-4">Updated At</th>
                                <th class="py-3 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subcription-tbody" class="divide-y divide-gray-800/60">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="max-w-4xl mx-auto px-4 py-6 text-center text-xs text-gray-500 border-t border-gray-800">
        Secret Admin Panel • JaySoundCloud
    </footer>

    <!-- SCRIPT -->
    <script>
        let supabaseClient = null;
        let adminToken = localStorage.getItem('jay_admin_token');

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                if (config.supabaseUrl && config.supabaseAnonKey) {
                    supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                }
            } catch (e) {
                console.error('Config load error:', e);
            }

            if (adminToken) {
                showAdminDashboard();
            }
        });

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    adminToken = data.token;
                    localStorage.setItem('jay_admin_token', adminToken);
                    showAdminDashboard();
                } else {
                    errorEl.textContent = data.error || 'Invalid username or password';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = 'Server login error';
                errorEl.classList.remove('hidden');
            }
        }

        function adminLogout() {
            adminToken = null;
            localStorage.removeItem('jay_admin_token');
            document.getElementById('admin-login-card').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-user-area').classList.add('hidden');
        }

        function showAdminDashboard() {
            document.getElementById('admin-login-card').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            document.getElementById('admin-user-area').classList.remove('hidden');
            loadSubscriptions();
        }

        async function handleAssignTier(e) {
            e.preventDefault();
            const email = document.getElementById('target-email').value.trim().toLowerCase();
            const tier = document.getElementById('target-tier').value;
            const successEl = document.getElementById('action-success');
            const errorEl = document.getElementById('action-error');

            successEl.classList.add('hidden');
            errorEl.classList.add('hidden');

            if (!supabaseClient) {
                errorEl.textContent = 'Supabase client not initialized. Check your environment variables.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                // Upsert subscription record
                const { error } = await supabaseClient
                    .from('subcription')
                    .upsert({ email, tier, updated_at: new Date().toISOString() }, { onConflict: 'email' });

                if (error) throw error;

                successEl.textContent = `Successfully updated ${email} to ${tier.toUpperCase()} tier!`;
                successEl.classList.remove('hidden');
                document.getElementById('target-email').value = '';
                loadSubscriptions();
            } catch (err) {
                errorEl.textContent = `Error: ${err.message}. Make sure the ` + "`subcription`" + ` table exists in Supabase.`;
                errorEl.classList.remove('hidden');
            }
        }

        async function loadSubscriptions() {
            if (!supabaseClient) return;
            const tbody = document.getElementById('subcription-tbody');
            tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-gray-400">Loading subcription...</td></tr>`;

            try {
                const { data, error } = await supabaseClient
                    .from('subcription')
                    .select('*')
                    .order('updated_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-gray-400">No active subcription found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(sub => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-soundcloud-hover transition';
                    
                    let badgeClass = 'bg-gray-800 text-gray-300';
                    if (sub.tier === 'premium') badgeClass = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                    else if (sub.tier === 'popular') badgeClass = 'bg-soundcloud-orange/20 text-soundcloud-orange border border-soundcloud-orange/30';
                    else if (sub.tier === 'starter') badgeClass = 'bg-blue-500/20 text-blue-400 border border-blue-500/30';

                    tr.innerHTML = `
                        <td class="py-3 px-4 font-medium text-white">${escapeHtml(sub.email)}</td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-md text-[11px] font-semibold uppercase ${badgeClass}">${escapeHtml(sub.tier)}</span></td>
                        <td class="py-3 px-4 text-gray-400">${new Date(sub.updated_at).toLocaleString()}</td>
                        <td class="py-3 px-4 text-right">
                            <button onclick="deleteSubscription('${sub.email}')" class="text-red-400 hover:text-red-300 p-1" title="Revoke">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-400">Failed to load subcription. Create the ` + "`subcription`" + ` table in Supabase.</td></tr>`;
            }
        }

        async function deleteSubscription(email) {
            if (!confirm(`Are you sure you want to revoke subscription for ${email}?`)) return;
            try {
                await supabaseClient.from('subcription').delete().eq('email', email);
                loadSubscriptions();
            } catch (err) {
                alert('Failed to delete subscription.');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
